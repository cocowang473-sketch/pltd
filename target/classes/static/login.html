<!DOCTYPE html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>PLDT Login</title>
    <style>
      :root {
        --red: #df3435;
        --red-dark: #bd2429;
        --red-soft: #f35b5d;
        --ink: #202125;
        --muted: #74767e;
        --line: #ececef;
        --thread: #f7f7f9;
      }

      * { box-sizing: border-box; margin: 0; padding: 0; }
      html, body { width: 100%; min-height: 100vh; }

      body {
        color: var(--ink);
        font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: var(--thread);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
      }

      .login-container {
        width: 100%;
        max-width: 400px;
      }

      .login-card {
        background: #fff;
        border-radius: 24px;
        box-shadow: 0 10px 40px rgba(86, 8, 12, 0.12);
        overflow: hidden;
      }

      .login-header {
        background: linear-gradient(180deg, #ec494b 0%, var(--red-dark) 100%);
        padding: 40px 30px;
        text-align: center;
        color: #fff;
      }

      .login-logo {
        width: 60px;
        height: 60px;
        margin: 0 auto 16px;
        border-radius: 16px;
        background: rgba(255, 255, 255, 0.15);
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        font-size: 18px;
        font-weight: 800;
        color: #fff;
        letter-spacing: 1px;
      }

      .login-title {
        font-size: 24px;
        font-weight: 700;
        margin-bottom: 4px;
      }

      .login-subtitle {
        font-size: 13px;
        opacity: 0.85;
      }

      .login-body {
        padding: 30px;
      }

      .form-group {
        margin-bottom: 20px;
      }

      .form-label {
        display: block;
        font-size: 13px;
        font-weight: 600;
        color: var(--ink);
        margin-bottom: 8px;
      }

      .form-input {
        width: 100%;
        height: 48px;
        padding: 0 16px;
        border: 1px solid var(--line);
        border-radius: 12px;
        font-size: 15px;
        color: var(--ink);
        background: var(--thread);
        transition: all 0.2s;
        outline: none;
      }

      .form-input:focus {
        border-color: var(--red);
        background: #fff;
        box-shadow: 0 0 0 3px rgba(223, 52, 53, 0.15);
      }

      .form-input::placeholder {
        color: var(--muted);
      }

      .login-error {
        background: #fef2f2;
        border: 1px solid #fecaca;
        border-radius: 12px;
        padding: 12px 16px;
        margin-bottom: 20px;
        color: #dc2626;
        font-size: 13px;
        display: none;
      }

      .login-error.show {
        display: block;
      }

      .login-button {
        width: 100%;
        height: 52px;
        border: none;
        border-radius: 12px;
        background: linear-gradient(145deg, var(--red-soft), var(--red-dark));
        color: #fff;
        font-size: 16px;
        font-weight: 700;
        cursor: pointer;
        transition: all 0.2s;
        box-shadow: 0 6px 20px rgba(190, 35, 40, 0.3);
      }

      .login-button:hover {
        transform: translateY(-1px);
        box-shadow: 0 8px 25px rgba(190, 35, 40, 0.4);
      }

      .login-button:active {
        transform: translateY(0);
      }

      .login-button:disabled {
        opacity: 0.6;
        cursor: not-allowed;
        transform: none;
      }

      .login-footer {
        text-align: center;
        padding: 20px 30px 30px;
        color: var(--muted);
        font-size: 12px;
      }

      @media (max-width: 480px) {
        .login-header {
          padding: 30px 20px;
        }
        .login-body {
          padding: 24px 20px;
        }
        .login-title {
          font-size: 20px;
        }
      }
    </style>
  </head>
  <body>
    <div class="login-container">
      <div class="login-card">
        <div class="login-header">
          <div class="login-logo">PLDT</div>
          <h1 class="login-title">Welcome to PLDT</h1>
          <p class="login-subtitle">Sign in to continue to chat support</p>
        </div>
        <div class="login-body">
          <div id="login-error" class="login-error"></div>
          <form id="login-form">
            <div class="form-group">
              <label class="form-label" for="username">Username</label>
              <input type="text" id="username" name="username" class="form-input" placeholder="Enter your username" required autocomplete="username">
            </div>
            <div class="form-group">
              <label class="form-label" for="password">Password</label>
              <input type="password" id="password" name="password" class="form-input" placeholder="Enter your password" required autocomplete="current-password">
            </div>
            <button type="submit" class="login-button" id="login-btn">Sign In</button>
          </form>
        </div>
        <div class="login-footer">
          PLDT Customer Support Portal
        </div>
      </div>
    </div>

    <script>
      const loginForm = document.getElementById('login-form');
      const loginError = document.getElementById('login-error');
      const loginBtn = document.getElementById('login-btn');

      loginForm.addEventListener('submit', async (e) => {
        e.preventDefault();

        const username = document.getElementById('username').value.trim();
        const password = document.getElementById('password').value;

        if (!username || !password) {
          showError('Please enter both username and password');
          return;
        }

        loginBtn.disabled = true;
        loginBtn.textContent = 'Signing in...';

        try {
          const response = await fetch('/api/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username, password })
          });

          const data = await response.json();

          if (response.ok && data.success) {
            window.location.href = '/app.html';
          } else {
            showError(data.error || 'Invalid username or password');
          }
        } catch (error) {
          showError('Unable to connect to server. Please try again.');
        } finally {
          loginBtn.disabled = false;
          loginBtn.textContent = 'Sign In';
        }
      });

      function showError(message) {
        loginError.textContent = message;
        loginError.classList.add('show');
        setTimeout(() => loginError.classList.remove('show'), 5000);
      }
    </script>
  </body>
</html>
